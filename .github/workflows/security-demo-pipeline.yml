name: Security Demo Pipeline (Vulnerability Detection)

on:
  push:
    branches:
      - security-demo-branch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set mvnw Permission
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B

  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set mvnw Permission
        run: chmod +x mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended

      - name: Build for CodeQL
        run: ./mvnw clean package -DskipTests -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker Image
        run: docker build -t healthcare-app:latest .

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: healthcare-app:latest
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy Results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trivy-results-demo
          path: trivy-results.txt
        continue-on-error: true

  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Checkov Dockerfile Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          file: Dockerfile
          framework: dockerfile
          soft_fail: false

  policy-gate:
    name: Policy Enforcement Gate
    runs-on: ubuntu-latest
    needs: [ gitleaks, codeql, trivy, checkov ]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Download Trivy Results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results-demo
        continue-on-error: true

      - name: Final Security Gate Decision
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CHECKOV_RESULT: ${{ needs.checkov.result }}
        run: |
          echo ""
          echo "##################################################"
          echo "##                                              ##"
          echo "##    SECURITY DEMO PIPELINE FINAL REPORT      ##"
          echo "##                                              ##"
          echo "##################################################"
          echo ""
          echo "  SECURITY TOOL RESULTS:"
          echo "  ──────────────────────────────────────────────"

          BLOCK=false

          if [ "$GITLEAKS_RESULT" = "failure" ]; then
            echo "  Gitleaks Secret Detection : FAILED"
            echo "    -> AWS credentials detected"
            echo "    -> GitHub token detected"
            echo "    -> Database password detected"
            BLOCK=true
          else
            echo "  Gitleaks Secret Detection : PASSED"
          fi

          if [ "$CODEQL_RESULT" = "failure" ]; then
            echo "  CodeQL SAST Analysis      : FAILED"
            echo "    -> SQL Injection detected"
            echo "    -> Command Injection detected"
            echo "    -> Path Traversal detected"
            BLOCK=true
          else
            echo "  CodeQL SAST Analysis      : PASSED"
          fi

          if [ "$TRIVY_RESULT" = "failure" ]; then
            echo "  Trivy Container Scan      : FAILED"
            echo "    -> Critical CVEs detected"
            BLOCK=true
          else
            echo "  Trivy Container Scan      : PASSED"
          fi

          if [ "$CHECKOV_RESULT" = "failure" ]; then
            echo "  Checkov IaC Security      : FAILED"
            echo "    -> Insecure Dockerfile"
            BLOCK=true
          else
            echo "  Checkov IaC Security      : PASSED"
          fi

          echo "  ──────────────────────────────────────────────"
          echo ""

          if [ "$BLOCK" = "true" ]; then
            echo "##################################################"
            echo ""
            echo "   DEPLOYMENT STATUS : BLOCKED"
            echo ""
            echo "   Vulnerable code automatically"
            echo "   prevented from reaching production"
            echo ""
            echo "   Patient data is protected"
            echo "   HIPAA compliance maintained"
            echo ""
            echo "##################################################"
            exit 1
          else
            echo "##################################################"
            echo ""
            echo "   DEPLOYMENT STATUS : ALLOWED"
            echo ""
            echo "##################################################"
          fi

  ai-summary:
    name: AI Security Summary
    runs-on: ubuntu-latest
    needs: [ policy-gate, gitleaks, codeql ]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Groq SDK
        run: pip install groq

      - name: Download Trivy Results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results-demo
        continue-on-error: true

      - name: Run AI Security Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: python ai-security-summary.py

      - name: Demo Pipeline Complete
        if: always()
        run: |
          echo "##################################################"
          echo "##                                              ##"
          echo "##     SECURITY DEMO PIPELINE COMPLETE         ##"
          echo "##                                              ##"
          echo "##################################################"
          echo ""
          echo "  Pipeline Stages:"
          echo "   1. Build Application    : PASSED"
          echo "   2. Gitleaks Scan        : FAILED"
          echo "   3. CodeQL SAST          : FAILED"
          echo "   4. Trivy Container Scan : CHECKED"
          echo "   5. Checkov IaC Scan     : CHECKED"
          echo "   6. Policy Gate          : BLOCKED"
          echo "   7. AI Summary           : COMPLETE"
          echo ""
          echo "  This proves:"
          echo "   -> Secrets cannot be committed"
          echo "   -> Injection attacks blocked"
          echo "   -> Patient data protected"
          echo "   -> HIPAA compliance enforced"
          echo ""
          echo "##################################################"
