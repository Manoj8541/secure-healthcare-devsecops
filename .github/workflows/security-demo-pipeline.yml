name: Security Demo Pipeline (Vulnerability Detection)

on:
  push:
    branches:
      - security-demo-branch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ==============================
  # JOB 1 — BUILD
  # ==============================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set mvnw Permission
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B

  # ==============================
  # JOB 2 — GITLEAKS
  # Runs independently
  # ALWAYS runs regardless of other jobs
  # ==============================
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Gitleaks Secret Scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gitleaks Result
        if: always()
        run: |
          echo "=========================================="
          echo " GITLEAKS SECRET DETECTION RESULT"
          echo "=========================================="
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo " ❌ FAILED"
            echo " Hardcoded secrets detected:"
            echo "   → AWS Access Key found"
            echo "   → AWS Secret Key found"
            echo "   → GitHub Token found"
            echo "   → Database Password found"
            echo " These credentials would expose:"
            echo "   → Patient database access"
            echo "   → Cloud infrastructure access"
            echo "   → Source code repository access"
            echo "=========================================="
          else
            echo " ✅ PASSED - No secrets detected"
            echo "=========================================="
          fi

  # ==============================
  # JOB 3 — CODEQL
  # Runs independently
  # ALWAYS runs regardless of other jobs
  # ==============================
  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set mvnw Permission
        run: chmod +x mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended

      - name: Build for CodeQL
        run: ./mvnw clean package -DskipTests -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

      - name: CodeQL Result
        if: always()
        run: |
          echo "=========================================="
          echo " CODEQL SAST ANALYSIS RESULT"
          echo "=========================================="
          echo " Vulnerabilities detected:"
          echo "   → SQL Injection in /demo/sql"
          echo "   → Command Injection in /demo/cmd"
          echo "   → Path Traversal in /demo/file"
          echo " Impact on Healthcare:"
          echo "   → Patient records exposed"
          echo "   → Server compromised"
          echo "   → Sensitive files accessible"
          echo "=========================================="

  # ==============================
  # JOB 4 — TRIVY
  # Runs independently
  # ALWAYS runs regardless of other jobs
  # ==============================
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker Image
        run: docker build -t healthcare-app:latest .

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: healthcare-app:latest
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trivy-results-demo
          path: trivy-results.txt
        continue-on-error: true

      - name: Trivy Result
        if: always()
        run: |
          echo "=========================================="
          echo " TRIVY CONTAINER SCAN RESULT"
          echo "=========================================="
          if [ -f "trivy-results.txt" ]; then
            CRITICAL=$(grep -c "CRITICAL" \
              trivy-results.txt 2>/dev/null || echo "0")
            HIGH=$(grep -c "HIGH" \
              trivy-results.txt 2>/dev/null || echo "0")
            echo " CRITICAL : $CRITICAL"
            echo " HIGH     : $HIGH"
          fi
          echo "=========================================="

  # ==============================
  # JOB 5 — CHECKOV
  # Runs independently
  # ALWAYS runs regardless of other jobs
  # ==============================
  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Checkov Dockerfile Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          file: Dockerfile
          framework: dockerfile
          soft_fail: true
        continue-on-error: true

      - name: Checkov Result
        if: always()
        run: |
          echo "=========================================="
          echo " CHECKOV IAC SECURITY RESULT"
          echo "=========================================="
          echo " Dockerfile security checks completed"
          echo "=========================================="

  # ==============================
  # JOB 6 — POLICY GATE
  # Waits for ALL jobs
  # ALWAYS runs
  # Shows ALL failures together
  # ==============================
  policy-gate:
    name: Policy Enforcement Gate
    runs-on: ubuntu-latest
    needs: [ gitleaks, codeql, trivy, checkov ]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Download Trivy Results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results-demo
        continue-on-error: true

      - name: Final Security Gate Decision
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CHECKOV_RESULT: ${{ needs.checkov.result }}
        run: |
          echo ""
          echo "##################################################"
          echo "##                                              ##"
          echo "##    SECURITY DEMO PIPELINE FINAL REPORT      ##"
          echo "##                                              ##"
          echo "##################################################"
          echo ""
          echo " Branch: security-demo-branch"
          echo " Purpose: Demonstrate vulnerability detection"
          echo ""
          echo "  SECURITY TOOL RESULTS:"
          echo "  ──────────────────────────────────────────────"

          BLOCK=false

          # Gitleaks Check
          if [ "$GITLEAKS_RESULT" = "failure" ]; then
            echo "  Gitleaks Secret Detection : ❌ FAILED"
            echo "    → AWS credentials detected"
            echo "    → GitHub token detected"
            echo "    → Database password detected"
            BLOCK=true
          else
            echo "  Gitleaks Secret Detection : ✅ PASSED"
          fi

          # CodeQL Check
          if [ "$CODEQL_RESULT" = "failure" ]; then
            echo "  CodeQL SAST Analysis      : ❌ FAILED"
            echo "    → SQL Injection detected"
            echo "    → Command Injection detected"
            echo "    → Path Traversal detected"
            BLOCK=true
          else
            echo "  CodeQL SAST Analysis      : ✅ PASSED"
          fi

          # Trivy Check
          if [ "$TRIVY_RESULT" = "failure" ]; then
            echo "  Trivy Container Scan      : ❌ FAILED"
            echo "    → Critical CVEs detected"
            BLOCK=true
          else
            echo "  Trivy Container Scan      : ✅ PASSED"
          fi

          # Checkov Check
          if [ "$CHECKOV_RESULT" = "failure" ]; then
            echo "  Checkov IaC Security      : ❌ FAILED"
            echo "    → Insecure Dockerfile config"
            BLOCK=true
          else
            echo "  Checkov IaC Security      : ✅ PASSED"
          fi

          echo "  ──────────────────────────────────────────────"
          echo ""

          # Final Decision
          if [ "$BLOCK" = "true" ]; then
            echo "  ⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔"
            echo ""
            echo "   DEPLOYMENT STATUS : BLOCKED ❌"
            echo ""
            echo "   This vulnerable code has been"
            echo "   automatically prevented from"
            echo "   reaching production environment."
            echo ""
            echo "   Patient data is protected. ✅"
            echo "   HIPAA compliance maintained. ✅"
            echo ""
            echo "  ⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔⛔"
            echo ""
            echo "##################################################"
            exit 1
          else
            echo "  ✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅"
            echo ""
            echo "   DEPLOYMENT STATUS : APPROVED ✅"
            echo ""
            echo "  ✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅"
            echo ""
            echo "##################################################"
          fi