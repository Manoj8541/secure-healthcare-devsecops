name: Security Demo Pipeline (Vulnerability Detection)

on:
  push:
    branches:
      - demo         
  pull_request:
    branches:
      - demo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set mvnw Permission
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: healthcare-jar-demo
          path: target/*.jar

  # ════════════════════════════════════════════════════════
  # GITLEAKS — Hardcoded secrets detection
  # WILL FAIL — AWS_KEY, GITHUB_TOKEN, DB_PASSWORD detected
  # ════════════════════════════════════════════════════════
  gitleaks:
    name: "Gitleaks Secret Detection [EXPECTED FAIL]"
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: "Gitleaks Scan — Detecting hardcoded secrets"
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true     # Let pipeline continue to show full report

      - name: Report Gitleaks Status
        run: |
          echo "=================================================="
          echo "  GITLEAKS SCAN COMPLETE"
          echo "  Secrets found in VulnerableDemo.java:"
          echo "    -> AWS_KEY      : AKIAIOSFODNN7EXAMPLE"
          echo "    -> AWS_SECRET   : wJalrXUtnFEMI..."
          echo "    -> GITHUB_TOKEN : ghp_example..."
          echo "    -> DB_PASSWORD  : SuperSecret123!"
          echo "  Status: VULNERABILITIES DETECTED"
          echo "=================================================="

  # ════════════════════════════════════════════════════════
  # CODEQL — SAST source code analysis
  # WILL DETECT — SQL Injection, XSS, Path Traversal,
  #               Command Injection, Hardcoded credentials
  # ════════════════════════════════════════════════════════
  codeql:
    name: "CodeQL SAST Analysis [EXPECTED FINDINGS]"
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set mvnw Permission
        run: chmod +x mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended

      - name: Build for CodeQL
        run: ./mvnw clean package -DskipTests -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

      - name: Report CodeQL Findings
        run: |
          echo "=================================================="
          echo "  CODEQL SAST ANALYSIS COMPLETE"
          echo "  Vulnerabilities detected in VulnerableDemo.java:"
          echo "    -> SQL Injection       : /demo/sql endpoint"
          echo "    -> XSS                 : /demo/xss endpoint"
          echo "    -> Path Traversal      : /demo/file endpoint"
          echo "    -> Command Injection   : /demo/exec endpoint"
          echo "    -> Hardcoded Secrets   : AWS + GitHub + DB"
          echo "  Check GitHub Security tab for full report"
          echo "  Status: CRITICAL VULNERABILITIES FOUND"
          echo "=================================================="

  # ════════════════════════════════════════════════════════
  # TRIVY — Container vulnerability scan
  # ════════════════════════════════════════════════════════
  trivy:
    name: "Trivy Container Scan"
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker Image
        run: docker build -t healthcare-app:demo .

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: healthcare-app:demo
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          exit-code: '0'            # Report only — don't block here
        continue-on-error: true

      - name: Upload Trivy Results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trivy-results-demo
          path: trivy-results.txt
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # CHECKOV — Dockerfile security scan
  # ════════════════════════════════════════════════════════
  checkov:
    name: "Checkov IaC Security"
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Checkov Dockerfile Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          file: Dockerfile
          framework: dockerfile
          soft_fail: true           # Report findings, continue to policy gate
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # POLICY GATE — Final decision
  # Reads all scan results and BLOCKS deployment
  # ════════════════════════════════════════════════════════
  policy-gate:
    name: Policy Enforcement Gate
    runs-on: ubuntu-latest
    needs: [ gitleaks, codeql, trivy, checkov ]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Download Trivy Results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results-demo
        continue-on-error: true

      - name: Final Security Gate Decision
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CHECKOV_RESULT: ${{ needs.checkov.result }}
        run: |
          echo ""
          echo "##################################################"
          echo "##                                              ##"
          echo "##    SECURITY DEMO PIPELINE FINAL REPORT      ##"
          echo "##                                              ##"
          echo "##################################################"
          echo ""
          echo "  SECURITY TOOL RESULTS:"
          echo "  ──────────────────────────────────────────────"

          BLOCK=false

          # Gitleaks check
          if [ "$GITLEAKS_RESULT" = "failure" ]; then
            echo "  [FAIL] Gitleaks Secret Detection"
            echo "         -> AWS credentials detected in source code"
            echo "         -> GitHub token committed to repository"
            echo "         -> Database password exposed"
            BLOCK=true
          else
            echo "  [PASS] Gitleaks Secret Detection"
          fi

          echo ""

          # CodeQL check — findings go to Security tab
          # CodeQL job itself passes (uploads results)
          # We treat any open findings as a block signal
          echo "  [WARN] CodeQL SAST Analysis"
          echo "         -> SQL Injection detected in /demo/sql"
          echo "         -> XSS vulnerability in /demo/xss"
          echo "         -> Path Traversal in /demo/file"
          echo "         -> Command Injection in /demo/exec"
          echo "         -> Hardcoded credentials detected"
          echo "         -> See GitHub Security tab for full report"
          BLOCK=true

          echo ""

          # Trivy check
          if [ "$TRIVY_RESULT" = "failure" ]; then
            echo "  [FAIL] Trivy Container Scan"
            echo "         -> Critical CVEs detected in image"
            BLOCK=true
          else
            echo "  [INFO] Trivy Container Scan : Completed"
            echo "         -> Review trivy-results artifact for details"
          fi

          echo ""

          # Checkov check
          if [ "$CHECKOV_RESULT" = "failure" ]; then
            echo "  [FAIL] Checkov IaC Security"
            echo "         -> Insecure Dockerfile configuration"
            BLOCK=true
          else
            echo "  [INFO] Checkov IaC Security : Completed"
          fi

          echo "  ──────────────────────────────────────────────"
          echo ""

          if [ "$BLOCK" = "true" ]; then
            echo "##################################################"
            echo "##                                              ##"
            echo "##      DEPLOYMENT STATUS : BLOCKED             ##"
            echo "##                                              ##"
            echo "##  Reason: Security vulnerabilities detected   ##"
            echo "##  Vulnerable code prevented from production   ##"
            echo "##  Patient data is protected                   ##"
            echo "##  HIPAA compliance maintained                 ##"
            echo "##                                              ##"
            echo "##################################################"
            exit 1
          else
            echo "##################################################"
            echo "##      DEPLOYMENT STATUS : ALLOWED             ##"
            echo "##################################################"
          fi

  # ════════════════════════════════════════════════════════
  # AI SUMMARY — Runs always, even after policy gate blocks
  # Shows AI analysis of all security findings
  # ════════════════════════════════════════════════════════
  ai-summary:
    name: AI Security Summary
    runs-on: ubuntu-latest
    needs: [ policy-gate, gitleaks, codeql, trivy, checkov ]
    if: always()                    # ALWAYS runs — even after block

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Groq SDK
        run: pip install groq

      - name: Download Trivy Results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results-demo
        continue-on-error: true

      - name: Run AI Security Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CHECKOV_RESULT: ${{ needs.checkov.result }}
          PIPELINE_MODE: "DEMO"
        run: python ai-security-summary.py

      - name: Demo Pipeline Complete Summary
        if: always()
        run: |
          echo ""
          echo "##################################################"
          echo "##                                              ##"
          echo "##     SECURITY DEMO PIPELINE COMPLETE         ##"
          echo "##                                              ##"
          echo "##################################################"
          echo ""
          echo "  Pipeline Stages:"
          echo "  ─────────────────────────────────────────────"
          echo "   1. Build Application    : PASSED"
          echo "   2. Gitleaks Scan        : FAILED  <-- secrets found"
          echo "   3. CodeQL SAST          : FINDINGS <-- see Security tab"
          echo "   4. Trivy Container Scan : CHECKED"
          echo "   5. Checkov IaC Scan     : CHECKED"
          echo "   6. Policy Gate          : BLOCKED  <-- deployment stopped"
          echo "   7. AI Summary           : COMPLETE"
          echo "  ─────────────────────────────────────────────"
          echo ""
          echo "  What this proves:"
          echo "   -> Hardcoded secrets detected before deployment"
          echo "   -> SQL Injection caught by SAST scanning"
          echo "   -> Command Injection blocked automatically"
          echo "   -> Patient data protected by pipeline gate"
          echo "   -> HIPAA compliance enforced automatically"
          echo "   -> Zero vulnerable code reaches production"
          echo ""
          echo "  GitHub Security Tab:"
          echo "   -> Shows all CodeQL findings with severity"
          echo "   -> SQL Injection, XSS, Path Traversal listed"
          echo "   -> Available at: repo/security/code-scanning"
          echo ""
          echo "##################################################"
