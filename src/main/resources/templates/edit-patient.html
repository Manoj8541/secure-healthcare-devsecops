<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Patient</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a href="/dashboard" class="brand">🏥 Health<span>Care</span></a>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/patients" class="active">Patients</a>
        <a href="/patients/add">Add Patient</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit"
                    style="background:none; border:none; color:white;
                   cursor:pointer; font-size:15px; padding: 8px 16px;
                   border-radius: 6px; transition: background 0.3s;"
                    onmouseover="this.style.background='rgba(255,255,255,0.2)'"
                    onmouseout="this.style.background='none'">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="form-card">
        <h2>Edit Patient</h2>

        <form th:action="@{/patients/edit/{id}(id=${patient.id})}"
              th:object="${patient}"
              method="post">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text"
                       th:field="*{name}"
                       required/>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number"
                       th:field="*{age}"
                       min="0" max="150"
                       required/>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select th:field="*{gender}" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}"/>
            </div>

            <div class="form-group">
                <label>Diagnosis</label>
                <input type="text"
                       th:field="*{diagnosis}"
                       required/>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-warning">
                    Update Patient
                </button>
                <a href="/patients" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
