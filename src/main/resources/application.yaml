server:
  port: 9090

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  session:
    timeout: 10m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.healthcare: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"